# Default values for Cupel.

image:
  # Published to GitHub Container Registry. A docker.io/davanolab mirror is
  # planned; point this there once it exists, or at your own mirror for an
  # air-gapped install.
  repository: ghcr.io/davano-innovation-lab/cupel-operator
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# Two replicas because both serve the admission webhook; see podDisruptionBudget.
replicaCount: 2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The operator's own identity.
  name: cupel-controller-manager
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
# An admission webhook that gets preempted takes model deployment with it,
# because the gate then fails open.
priorityClassName: system-cluster-critical

podAnnotations: {}
podLabels: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ---------------------------------------------------------------------------
# Operator behaviour
# ---------------------------------------------------------------------------
operator:
  leaderElect: true
  logLevel: info               # zap: debug | info | error

  # Deny workloads referencing a model with no security report. The permissive
  # default means installing Cupel cannot break a running cluster — but it also
  # means the gate admits anything it has not scanned. Watch
  # cupel_admission_decisions_total{outcome="allowed_unscanned"} before flipping
  # this, and see the alerts in metrics.prometheusRule.
  requireReport: false

  # Policy the gate consults when a workload names none.
  defaultPolicy: ""

  # Registry holding the scanner images. Point at a mirror for a disconnected
  # cluster; the scanner images carry their own databases, so scans need no
  # egress.
  scannerRegistry: ghcr.io/davano-innovation-lab

  # Fail a scan that has not reached a verdict in this long. Without it, a scan
  # whose report never lands retries forever.
  scanDeadlineMinutes: 120

  # How many files one scan fetches at once.
  #
  # A scan is almost entirely network wait: inspection runs at roughly 2.6 GB/s,
  # so on a real model the analysis is well under one percent of wall time and
  # the fetch is the rest. Raising this shortens a scan far more than any amount
  # of extra CPU would. It is bounded because the far side is usually a shared
  # registry with its own rate limits — 8 took a 893GB public model from 35s to
  # 5s; going much higher mostly earns HTTP 429s.
  #
  # Scanners themselves already run as one Job per scanner, so Kubernetes
  # spreads those across nodes without anything here.
  fetchParallelism: 8

  # Seconds to retain completed scan Jobs.
  jobTTLSeconds: 3600

  # Size limit for the scan workspace volume.
  workspaceSize: 50Gi

  # Optional Secret names, resolved in the namespace the scan runs in.
  pullSecret: ""      # dockerconfigjson, for OCI artifact pulls
  storageSecret: ""   # S3/ODF credentials for artifact fetches

# ---------------------------------------------------------------------------
# Scan identity
# ---------------------------------------------------------------------------
scanner:
  serviceAccountName: cupel-scanner

  # Scan Jobs are created in the namespace of the ArtifactScan, and the scan
  # ServiceAccount must exist there or the pod is unschedulable. List every
  # namespace you will create scans in; the release namespace is always
  # included.
  additionalNamespaces: []

# ---------------------------------------------------------------------------
# Admission webhook
# ---------------------------------------------------------------------------
webhook:
  enabled: true

  # How the serving certificate is provisioned. This is the setting that
  # decides whether Cupel can run on your cluster at all:
  #
  #   cert-manager - a Certificate/Issuer pair is created and the CA bundle is
  #                  injected by cert-manager's ca-injector. Requires
  #                  cert-manager with the CA injector enabled.
  #   openshift    - the service CA operator issues and rotates it, and injects
  #                  the CA bundle. No extra dependency, OpenShift only.
  #   external     - you provide the Secret and the caBundle yourself.
  #
  # The default is cert-manager because it is the one option that works on any
  # conformant cluster. It was openshift, which meant `helm install` with no
  # flags succeeded on exactly one vendor's distribution and, anywhere else,
  # left the webhook pod waiting on a Secret that would never appear.
  #
  # On OpenShift, prefer --set webhook.certMode=openshift: the service CA
  # operator is already present and needs no extra component.
  #
  # There is no self-signed fallback on purpose: a webhook whose certificate
  # cannot be verified is silently skipped under failurePolicy Ignore, which
  # looks exactly like a working gate.
  certMode: cert-manager

  certSecretName: cupel-webhook-server-cert

  # Only used when certMode is external.
  caBundle: ""

  certManager:
    # Uses a self-signed Issuer by default. Point at your own with issuerRef.
    issuerRef: {}
    duration: 8760h    # 1y
    renewBefore: 720h  # 30d

  # Ignore keeps an Cupel outage from blocking every model deployment. Fail is
  # the stronger setting: Ignore means anyone who can disrupt Cupel can also
  # bypass the gate.
  failurePolicy: Ignore
  timeoutSeconds: 10

  # Only namespaces carrying this label are gated. Cupel never gates itself.
  namespaceSelector:
    matchExpressions:
      - key: security.davano.io/enforce
        operator: In
        values: ["true"]

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
metrics:
  enabled: true
  port: 8080
  service:
    enabled: true
  # Both need the Prometheus Operator CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

# Retention for the objects Cupel creates.
#
# Every scan leaves a scan object and the reports it owns behind. Nothing used
# to remove them, so a cluster scanning steadily accumulated tens of thousands
# of objects a year. What ages out is the working detail of a scan; the verdict
# stays in the model's security report and the record of it stays in the audit
# chain.
retention:
  # Days a finished scan is kept before it and its reports are removed.
  # 0 keeps them forever, which is the old behaviour.
  scanDays: 90
  # How often retention and archiving run. Neither is urgent.
  intervalMinutes: 60

audit:
  # Moving the older part of the audit chain out of the cluster.
  #
  # The chain is append-only and grows for as long as the cluster scans. Left in
  # etcd it eventually reaches the backend quota, and an etcd over quota makes
  # the whole cluster read-only — not just Cupel. Archiving keeps what is stored
  # proportional to recent activity. The records are moved, not discarded, and
  # the checkpoint records where they went so the chain still verifies whole.
  archive:
    enabled: false
    # Mount an existing claim instead of creating one.
    existingClaim: ""
    size: 10Gi
    storageClass: ""
    mountPath: /var/lib/cupel/audit-archive
    # Records held in the cluster before a run archives the front of the chain.
    threshold: 50000
    # Records left in the cluster after a run.
    retain: 10000

gate:
  # How long an approval stands before the model has to be scanned again.
  #
  # 0, the default, means an approval never expires — which is how Cupel has
  # always behaved, so switching to this chart changes nothing about what your
  # cluster admits. Set it when you want one.
  #
  # A model version is a mutable pointer in most registries: a branch, a tag.
  # The bytes behind an approved name can be replaced after the approval was
  # given, and the digest check only catches that when the workload pins a
  # digest, which a registry reference usually does not.
  #
  #   180  a scan is good for half a year
  #   365  a scan is good for a year
  #
  # A stale approval is refused with a message saying to rescan. A stale
  # denial stays a denial: expiry can only take an approval away.
  maxReportAgeDays: 0

console:
  # The web console and the API behind it.
  #
  # Off by default, and not because it is unfinished: the API has no anonymous
  # mode on purpose, so it needs an OIDC issuer to start. An air-gapped cluster
  # without an identity provider has nowhere to point it, and a deployment that
  # cannot start is worse than one that was never created.
  enabled: false
  replicas: 1
  # Where role bindings come from: a ConfigMap mapping identity-provider groups
  # to roles and tenants.
  bindingsConfigMap: cupel-console-bindings
  bindingsPath: /config/bindings.yaml
  oidc:
    # Required when enabled. There is no fallback.
    issuerURL: ""
    clientID: ""
    redirectURL: ""
    # Secret holding the client secret, if the provider needs one.
    clientSecretRef: {}
    #   name: cupel-oidc
    #   key: client-secret
  tls:
    secretName: ""
    certFile: ""
    keyFile: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
