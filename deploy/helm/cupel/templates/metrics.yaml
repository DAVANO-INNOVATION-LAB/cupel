{{- if and .Values.metrics.enabled .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cupel.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cupel.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  selector:
    {{- include "cupel.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}

{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cupel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cupel.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cupel-model-scanner
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      path: /metrics
{{- end }}

{{- if .Values.metrics.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cupel.fullname" . }}-gate-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cupel.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  groups:
    - name: cupel.gate
      rules:
        # Each of these is a way for the gate to be doing nothing while looking
        # entirely healthy, which is why they are alerts and not dashboards.
        - alert: CupelAdmittingUnscannedModels
          expr: sum(rate(cupel_admission_decisions_total{outcome="allowed_unscanned"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Cupel is admitting models it has never scanned
            description: >-
              Workloads are being admitted because no ModelSecurityReport exists
              for them. Cupel is not gating these deployments.

        - alert: CupelGateBypassedByAnnotation
          expr: sum(rate(cupel_admission_decisions_total{outcome="allowed_skip_annotation"}[1h])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Workloads are skipping Cupel validation by annotation
            description: >-
              security.davano.io/skip-validation is in use. Anyone who can set it
              on their own workload bypasses the gate.

        - alert: CupelScannerErroring
          expr: sum by (scanner) (rate(cupel_scanner_results_total{status="Error"}[30m])) > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Scanner {{ `{{ $labels.scanner }}` }} is failing"
            description: >-
              A failing scanner produces no findings, which is scored the same as
              a clean result for that dimension.

        - alert: CupelSourceSyncFailing
          expr: sum by (source) (rate(cupel_source_sync_failures_total[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Cupel cannot sync model source {{ `{{ $labels.source }}` }}"
            description: >-
              New model versions are not being discovered, so they will deploy as
              unscanned.
{{- end }}
