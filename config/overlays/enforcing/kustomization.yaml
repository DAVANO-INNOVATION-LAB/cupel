# The posture to move to once scan coverage is complete.
#
# Both changes are one-way doors in practice, so make them deliberately and in
# this order:
#
#   1. --require-report=true    unscanned models are DENIED rather than admitted.
#      Drive cupel_admission_decisions_total{outcome="allowed_unscanned"} to zero
#      first, or this will deny workloads that were previously fine.
#
#   2. failurePolicy: Fail      an Cupel outage blocks model deployments instead
#      of silently letting them through. This is the setting that makes the gate
#      real: with Ignore, anyone who can disrupt Cupel can bypass it. It also
#      means a broken Cupel is now an incident, so do it after 1 is stable.
#
#   kubectl apply -k config/overlays/enforcing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../default

patches:
  - target:
      kind: Deployment
      name: cupel-controller-manager
    patch: |
      # Replace rather than append: appending leaves the flag present twice
      # with contradictory values, which works (Go's flag package takes the
      # last) but reads as a misconfiguration to anyone inspecting the
      # Deployment. The `test` op fails the build loudly if the base's arg
      # order changes, rather than silently patching the wrong flag.
      - op: test
        path: /spec/template/spec/containers/0/args/5
        value: --require-report=false
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --require-report=true

  - target:
      kind: ValidatingWebhookConfiguration
      name: cupel-model-deployment-gate
    patch: |
      - op: replace
        path: /webhooks/0/failurePolicy
        value: Fail
