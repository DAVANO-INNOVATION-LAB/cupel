---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: auditcheckpoints.security.davano.io
spec:
  group: security.davano.io
  names:
    kind: AuditCheckpoint
    listKind: AuditCheckpointList
    plural: auditcheckpoints
    singular: auditcheckpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.length
      name: Length
      type: integer
    - jsonPath: .spec.head
      name: Head
      type: string
    - jsonPath: .spec.archivedLength
      name: Archived
      type: integer
    - jsonPath: .spec.time
      name: Time
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuditCheckpoint publishes the head of the audit chain.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuditCheckpointSpec commits to the state of the log at a moment.

              This is what makes tail truncation detectable. Anchoring it outside the
              cluster — in a signed evidence bundle, or an auditor's own records — is what
              makes the log tamper-evident against someone who controls the cluster.
            properties:
              archiveLocation:
                description: |-
                  ArchiveLocation is where the archived records were written, so a reader
                  who needs the whole chain knows there is more of it and where to look.
                type: string
              archivedHead:
                description: |-
                  ArchivedHead is the hash of the last archived record: the point the
                  records still in the cluster attach to.
                type: string
              archivedLength:
                description: |-
                  ArchivedLength is how many records from the front of the chain have been
                  written out of the cluster and deleted from it. Zero means the whole
                  chain is still here.

                  Length above stays the length of the whole chain, archived records
                  included, so a checkpoint means the same thing before and after an
                  archive runs.
                format: int64
                type: integer
              head:
                description: Head is the hash of the final record.
                type: string
              length:
                description: Length is how many records the chain held.
                format: int64
                type: integer
              time:
                description: Time the checkpoint was taken.
                format: date-time
                type: string
            required:
            - head
            - length
            - time
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
