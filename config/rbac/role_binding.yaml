---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cupel-manager-rolebinding
  labels:
    app.kubernetes.io/name: cupel-model-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cupel-manager-role
subjects:
  - kind: ServiceAccount
    name: cupel-controller-manager
    namespace: cupel-system
---
# Leader election for the manager's active replica.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cupel-leader-election-role
  namespace: cupel-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cupel-leader-election-rolebinding
  namespace: cupel-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cupel-leader-election-role
subjects:
  - kind: ServiceAccount
    name: cupel-controller-manager
    namespace: cupel-system
