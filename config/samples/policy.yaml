---
# A production baseline: no malware, no live secrets, no critical CVEs, and
# no pickle-format weights. Enforcement rejects failing deployments outright.
apiVersion: security.davano.io/v1alpha1
kind: ArtifactScanPolicy
metadata:
  name: production-baseline
  namespace: cupel-system
spec:
  enforcement: Enforce
  scanners:
    - name: clamav
    - name: trivy
    - name: syft
    - name: trufflehog
    - name: model-inspector
    - name: provenance
    # The bill of materials. Listing scanners explicitly overrides the catalog
    # defaults, so leaving this out silently turns the AIBOM off.
    - name: tessera
  rules:
    maxCriticalCVEs: 0
    maxHighCVEs: 5
    blockMalware: true
    blockSecrets: true
    # Quarantine on a critical model-inspection finding: a pickle importing
    # os.system, an archive escaping its directory, trust_remote_code. These
    # execute on load, so they are treated as seriously as malware.
    blockUnsafeModel: true
    # Refuse an artifact part of which could not be read. Without this, a file
    # the scanner recognised and failed to parse produces a report identical to
    # one it read and found clean: no findings either way.
    blockUnexamined: true
    # Bound high-severity model findings too. blockUnsafeModel covers Critical
    # only, so without this a chat template reaching the interpreter or a native
    # library beside the weights is reported and admitted.
    maxHighModelFindings: 0
    requireSBOM: true
    requireSignature: false
    blockedFormats:
      - pickle
    allowedFormats:
      - safetensors
      - onnx
      - gguf
---
# A permissive policy for development namespaces: the same scanners run and
# results are recorded, but nothing is blocked. Use this to measure the blast
# radius of a stricter policy before enforcing it.
apiVersion: security.davano.io/v1alpha1
kind: ArtifactScanPolicy
metadata:
  name: development-audit
  namespace: cupel-system
spec:
  enforcement: Audit
  scanners:
    - name: clamav
    - name: trivy
    - name: syft
    - name: model-inspector
  rules:
    blockMalware: true
    blockSecrets: true
    blockUnsafeModel: true
